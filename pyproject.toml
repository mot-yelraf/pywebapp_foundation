[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pywebapp-foundation"
dynamic = ["version", "dependencies", "optional-dependencies"]
requires-python = ">=3.10"
description = "A browser-first foundation for Python applications"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.dynamic]
version = {attr = "pwaf_foundation.__version__"}
dependencies = {file = ["requirements.txt"]}
optional-dependencies.dev = {file = ["requirements-test.txt"]}
optional-dependencies.desktop = {file = ["requirements-desktop.txt"]}

[tool.setuptools.packages.find]
include = ["pwaf_foundation*", "app*"]

[tool.setuptools.package-data]
pwaf_foundation = ["templates/*.html", "static/*.css", "static/*.js",
  "static/*.webmanifest", "static/icons/*", "static/icons/*/*"]
app = ["identity.json", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["pwaf_foundation", "app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 95
