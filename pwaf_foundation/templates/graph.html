<dialog id="graph-dialog" class="graph-dialog" aria-labelledby="graph-title">
  <div class="graph-shell">
    <header class="dialog-header"><h2 id="graph-title">Graphum</h2><button type="button" class="icon-button" id="close-graph" aria-label="Close Graphum" autofocus>×</button></header>
    <div class="graph-workspace">
      <aside class="graph-controls" aria-label="Graph controls">
        <h3>Time range</h3>
        <div class="graph-ranges" role="group" aria-label="Time range">
          {% for hours, label in ui.graph_ranges %}
          <button type="button" class="secondary" data-graph-hours="{{ hours }}" aria-pressed="{{ 'true' if hours == ui.graph_default_hours else 'false' }}">{{ label }}</button>
          {% endfor %}
        </div>
        <h3>Metrics <small id="graph-count">0 of 4</small></h3>
        <div id="graph-metrics"></div>
        <p id="graph-status" role="status">No metrics available.</p>
      </aside>
      <section class="graph-stage" aria-label="Time-series plots">
        <header><h3 id="graph-range-title">Selected time range</h3><p>Up to four metrics · separate scales</p></header>
        <div id="graph-plots"><p class="graph-empty">No graph data available yet.</p></div>
      </section>
    </div>
  </div>
</dialog>
